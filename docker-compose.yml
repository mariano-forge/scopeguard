# Local Postgres for development: `npm run db:up`, then `npm run db:migrate`.
# Matches DATABASE_URL_LOCAL in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    container_name: kora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora -d kora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kora-postgres:
