# Local services for development (`npm run db:up`), matching the *_LOCAL variables of .env.example:
# Postgres (then `npm run db:migrate`) and Azurite, the Azure Storage emulator, for imported files.
services:
  postgres:
    image: postgres:17-alpine
    container_name: kora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora -d kora"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: kora-azurite
    restart: unless-stopped
    # Blob service only; accepts the API versions recent SDKs send.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - kora-azurite:/data

volumes:
  kora-postgres:
  kora-azurite:
